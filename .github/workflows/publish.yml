name: Publish to npm

# Verified n8n community nodes must be published from CI with a provenance
# statement, so the package can be traced back to this repository and commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Node 22 still ships npm
      # 10.x, which fails the publish step without a useful message.
      - run: npm install -g npm@latest

      - run: npm --version

      # Fail before build/lint if the tag and package.json disagree, rather
      # than after, with npm's "cannot publish over existing version".
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            echo "Bump package.json (or retag) so the two agree, then push again."
            exit 1
          fi
          echo "Publishing version $PKG"

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm publish --provenance --access public
