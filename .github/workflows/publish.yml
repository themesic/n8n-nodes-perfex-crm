name: Publish to npm

# Verified n8n community nodes must be published from CI with a provenance
# statement, so the package can be traced back to this repository and commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Node 22 still ships npm
      # 10.x, which fails the publish step without a useful message.
      - run: npm install -g npm@latest

      - run: npm --version

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm publish --provenance --access public
